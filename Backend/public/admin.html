<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - All Complaints</title>
  <style>
    body { font-family: monospace, sans-serif; margin: 30px; background-color: #f4f4f4; }
    .container { max-width: 800px; margin: auto; }
    .card { background: white; border: 2px solid #000; padding: 15px; margin-bottom: 15px; position: relative; }
    .card img { max-width: 100%; height: 200px; object-fit: cover; display: block; margin-top: 10px; }
    .badge { background: #000; color: #fff; padding: 3px 8px; font-size: 0.8rem; }
    .delete-btn { background: #d9534f; color: white; border: none; padding: 6px 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .delete-btn:hover { background: #c9302c; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🛠️ Admin Complaints Dashboard</h2>
    <div id="complaintsList">Loading complaints...</div>
  </div>

  <script>
    async function fetchComplaints() {
      const container = document.getElementById('complaintsList');
      try {
        const res = await fetch('/api/complaints');
        const responseData = await res.json();
        const complaints = Array.isArray(responseData) ? responseData : (responseData.data || []);

        if (complaints.length > 0) {
          container.innerHTML = complaints.map(item => `
            <div class="card" id="card-${item._id}">
              <h3>Category: ${item.category || 'N/A'} <span class="badge">${item.severity || 'Low'}</span></h3>
              <p><strong>Description:</strong> ${item.description || 'N/A'}</p>
              <p><strong>Location:</strong> Lat ${item.location?.latitude || 'N/A'}, Long ${item.location?.longitude || 'N/A'}</p>
              <p><strong>Submitted:</strong> ${item.createdAt ? new Date(item.createdAt).toLocaleString() : 'N/A'}</p>
              ${item.mediaPath ? `<img src="${item.mediaPath}" alt="Evidence">` : ''}
              <button class="delete-btn" onclick="deleteComplaint('${item._id}')">🗑️ Delete Complaint</button>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p>No complaints filed yet.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="color:red;">Error loading complaints.</p>';
      }
    }

    async function deleteComplaint(id) {
      if (!confirm('Are you sure you want to delete this complaint?')) return;

      try {
        const res = await fetch(`/api/complaints/${id}`, { method: 'DELETE' });
        const result = await res.json();

        if (result.success) {
          // Remove the element from DOM
          document.getElementById(`card-${id}`).remove();
        } else {
          alert('Failed to delete: ' + result.message);
        }
      } catch (err) {
        alert('Server error while deleting complaint.');
      }
    }

    fetchComplaints();
  </script>
</body>
</html>
