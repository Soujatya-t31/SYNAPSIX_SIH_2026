<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Application</title>
  <style>
    body { font-family: monospace, sans-serif; margin: 30px; background-color: #f4f4f4; }
    .container { max-width: 480px; background: white; padding: 20px; border: 2px solid #000; margin: auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, textarea, button { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background: #000; color: #fff; border: none; padding: 12px; font-weight: bold; cursor: pointer; }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h2>👤 Citizen Application</h2>
    <p>Report Infrastructure Problem in under 30–60 seconds.</p>

    <form id="complaintForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>📷 Upload Image/Video:</label>
        <input type="file" name="media" accept="image/*,video/*" required>
      </div>

      <div class="form-group">
        <label>📍 Location:</label>
        <input type="text" id="locationStatus" value="Detecting location..." readonly>
        <input type="hidden" name="latitude" id="latitude">
        <input type="hidden" name="longitude" id="longitude">
      </div>

      <div class="form-group">
        <label>🏷️ Category:</label>
        <select name="category" required>
          <option value="Road/Pothole">Road/Pothole</option>
          <option value="Streetlight">Streetlight</option>
          <option value="Garbage">Garbage</option>
          <option value="Drainage">Drainage</option>
          <option value="Water Leakage">Water Leakage</option>
          <option value="Traffic Signal">Traffic Signal</option>
          <option value="Public Toilet">Public Toilet</option>
          <option value="Footpath">Footpath</option>
          <option value="Bridge">Bridge</option>
          <option value="Public Building">Public Building</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>📝 Description:</label>
        <textarea name="description" placeholder="Large pothole near school" required></textarea>
      </div>

      <div class="form-group">
        <label>🚨 Optional Severity:</label>
        <select name="severity">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
          <option value="Dangerous">Dangerous</option>
        </select>
      </div>

      <button type="submit">[ SUBMIT COMPLAINT ]</button>
    </form>
    <div id="statusMessage" style="margin-top:10px; font-weight:bold;"></div>
  </div>

  <script>
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById('latitude').value = pos.coords.latitude;
          document.getElementById('longitude').value = pos.coords.longitude;
          document.getElementById('locationStatus').value = `Captured (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
        },
        () => { document.getElementById('locationStatus').value = "Location permission denied/unavailable"; }
      );
    }

    document.getElementById('complaintForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.textContent = 'Submitting...';

      try {
        const res = await fetch('/api/complaints', { method: 'POST', body: new FormData(e.target) });
        const result = await res.json();
        if (result.success) {
          statusDiv.style.color = 'green';
          statusDiv.textContent = 'Complaint submitted successfully!';
          e.target.reset();
        } else {
          statusDiv.style.color = 'red';
          statusDiv.textContent = result.message;
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = 'Error connecting to server.';
      }
    });
  </script>
</body>
</html>
